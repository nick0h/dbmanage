<div class="card-header d-flex justify-content-between align-items-center detail-section-header"
     role="button"
     data-bs-toggle="collapse"
     data-bs-target="#{{ section_id }}"
     aria-expanded="{% if start_collapsed %}false{% else %}true{% endif %}"
     aria-controls="{{ section_id }}"
     style="cursor: pointer;">
    <h5 class="card-title mb-0">
        {% if icon %}<i class="{{ icon }} me-2"></i>{% endif %}{{ title }}
    </h5>
    <i class="fas fa-chevron-down detail-section-chevron"></i>
</div>
{% if open_collapse != False %}
<div class="collapse{% if not start_collapsed %} show{% endif %}" id="{{ section_id }}">
{% endif %}
